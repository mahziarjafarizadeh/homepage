            d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z">
          </path>
        </svg>
      </a>

      <div class="scroll-top-btn" title="Back to top">
        <svg class="scroll-top-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path
            d="M12.0001 4.83594L5.79297 11.043L7.20718 12.4573L12.0001 7.66436L16.793 12.4573L18.2072 11.043L12.0001 4.83594ZM12.0001 10.4858L5.79297 16.6929L7.20718 18.1072L12.0001 13.3143L16.793 18.1072L18.2072 16.6929L12.0001 10.4858Z"
            fill="currentColor" />
        </svg>

      <p class="copyright">
        Copyright © 2022-2025 <a href="#top" class="copyright-link">Mahziar Jafarizadeh</a>
      </p>
    </footer>
  </div>

  <script>
    window.addEventListener('scroll', function () {
      const logoWrapper = document.querySelector('.logo-wrapper');
      const scrollIndicator = document.querySelector('.scroll-indicator');
      const scrollPosition = window.scrollY;
      const fadeRange = 400;

      const scrollFraction = Math.min(scrollPosition / fadeRange, 1);
      const opacity = 1 - scrollFraction;
      const blur = scrollFraction * 10;
      const translateY = -scrollFraction * 80;

      window.requestAnimationFrame(() => {
        if (logoWrapper) {
          logoWrapper.style.opacity = opacity;
          logoWrapper.style.filter = `blur(${blur}px)`;
          logoWrapper.style.transform = `translateY(${translateY}px)`;
        }
        if (scrollIndicator) {
          scrollIndicator.style.opacity = opacity;
        }
      });
    });

    const scrollTopBtn = document.querySelector('.scroll-top-btn');

    if (scrollTopBtn) {
      scrollTopBtn.addEventListener('click', (e) => {
        e.preventDefault();
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    }
  </script>
